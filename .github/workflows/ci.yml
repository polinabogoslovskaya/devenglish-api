name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install fastapi uvicorn pytest httpx

      - name: Run tests
        run: pytest
      - name: Save test results
        if: always()
        run: |
            mkdir -p test-results
            echo "Tests executed by GitHub Actions" > test-results/report.txt

      - name: Upload test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: test-results
            path: test-results/report.txt
